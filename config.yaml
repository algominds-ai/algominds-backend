# Every tunable number in the engine. Edit here, then run `bun run config`.
# src/config.ts is generated from this file and is never edited by hand.

# Hard ceilings on what one request may ask for. A caller's number wins up to
# these; beyond them the request is clamped and the clamp is reported, never
# silently applied. They exist so a single request cannot force unbounded work.
limits:
  # Three rounds return at most 300 candidates, so asking for more than this
  # can never be satisfied anyway. The cap makes that explicit at the boundary.
  maxCompaniesPerRequest: 300
  # How many companies a people run searches when the caller gives no
  # maxCompanies. The caller's own number always wins over this.
  defaultMaxCompaniesPerPeopleRun: 100
  # Each company in a people run is its own bounded step budget: one pick is at
  # most 28 steps (a start, up to 24 polls, an index, an agree, a quote), six
  # picks 168, and one company 175 with its seven fixed steps. Workflows
  # declares a 25,000 step ceiling on FIND_PEOPLE, so this is the largest
  # company count that arithmetic clears in every mode, roster included.
  maxCompaniesPerPeopleRun: 100
  # The most rows GET /runs/{runId}/companies and GET /runs/{runId}/people
  # return in one page. A caller's own limit wins up to this; beyond it the
  # request is clamped and the response reports the limit actually used, so
  # the clamp is never silent.
  maxRunPageSize: 200

# Where the auth endpoints are served, and who may call them. Without these
# the origin is inferred from each request, which is fine locally and is not
# something to deploy on: a state-changing call is refused outright when it
# carries no origin, and accepted from any origin when it carries one.
auth:
  # Hosts allowed to serve the auth endpoints. The request's own host is used
  # when it matches one of these, so one deployment can answer on several.
  allowedHosts:
    - localhost
    - 127.0.0.1
    - api.algominds.ai
  # Used when the request names no host we allow.
  fallbackUrl: https://api.algominds.ai
  # Origins a browser may call the auth endpoints from. A dashboard on another
  # domain belongs here; anything absent is refused.
  trustedOrigins:
    - http://localhost:8787
    - http://127.0.0.1:8787
    - https://algominds.ai
    - https://*.algominds.ai

companies:
  # Rounds of search per run. Each round is one paid Exa call plus two model calls.
  maxRounds: 3
  # Exa returns at most 100 records per call. Fewer makes the requested count unreachable.
  resultsPerRound: 100
  # Candidates sent to the judge, as a multiple of the requested count. Measured on
  # two profiles: every judge refusal sat at rank nineteen or lower, so 2x candidates
  # was never short a company the judge would have kept.
  judgeCandidateMultiple: 2
  # How much of a company description reaches the judge.
  descriptionChars: 600
  # Window for treating a domain as already seen: every company the account
  # found in the trailing N days, across every profile it owns. Feeds both
  # excludeDomains on the search request and the seen-domain gate.
  seenDomainsWindowDays: 60
  # The source and the agent's effort are no longer set here. The synthesizer picks
  # both per round from the profile, because only it knows whether the profile asks
  # for a recent event. Its effort choice is limited to two values: "low", measured
  # at about $0.025 and 5 seconds, and "medium", measured at about $0.10 and 2
  # minutes. Higher levels exist on the vendor but are not offered to the model.
  # Seconds between polls of a running exa-agent run.
  exaAgentPollIntervalSeconds: 5
  # Polls allowed before a stuck exa-agent run is treated as failed. A run that
  # only has to name companies returns in about 5 seconds. A run that must also
  # satisfy the plan's headcount band and countries takes far longer: measured
  # runs asking for three constrained companies passed 120 seconds and were
  # killed mid-flight, losing everything already paid for. 60 polls at 5
  # seconds is 5 minutes, which covers the constrained case.
  exaAgentMaxPollAttempts: 60
  # Angles one agent round fans out across, each its own paid run. Measured: an agent run
  # asked for twenty companies returned one, because it stops at schema_satisfied, so more
  # companies come from more angles rather than a bigger ask. Seven angles returned nine
  # companies in 139 seconds.
  maxAnglesPerRound: 12
  # Companies one agent angle is asked for. Small on purpose: the ask is not the floor.
  companiesPerAngle: 4
  # Milliseconds between two agent run starts. Exa refuses above ten requests a second,
  # measured live, and a fan-out starts every angle at once without this.
  agentStartStaggerMs: 1500
  # Domains an agent run is told by name to skip. The gate enforces the whole exclusion
  # list; naming a bounded head of it in the query only stops the agent paying for
  # companies that would be dropped anyway.
  agentExcludedDomainsNamed: 50
  # Concurrent proving lookups and record backfills, under the same ten-a-second limit.
  provingConcurrency: 5
  # Results one proving lookup asks for. The first carrying a quote wins.
  provingResults: 3
  # Characters of page text Exa returns per page. The vendor's documented maximum is 10000;
  # a larger number is clamped rather than refused.
  contentsMaxCharacters: 10000
  # Rows sent to the judge in one model call. A batch of 15 still timed out twice on a
  # 40-row judge; slicing into batches this size keeps each call inside model.timeoutMs below.
  judgeBatchSize: 8
  # Cap on the single wait after an Exa 429, whether from Retry-After or the
  # one-second default used when Exa sends no header.
  exaRetryAfterMaxMs: 5000
  # Poll requests the whole angle fan-out may spend per second; a round's poll
  # interval scales up with the angles in flight to stay under this.
  exaPollBudgetPerSecond: 2

people:
  # Seconds between polls of a running exa-agent run.
  exaAgentPollIntervalSeconds: 5
  # Polls allowed before a stuck exa-agent run is treated as failed. 24 polls
  # at 5 seconds is 2 minutes, well past the measured 5-second completion time.
  exaAgentMaxPollAttempts: 24
  # Milliseconds before a Clay create or run fetch is treated as timed out.
  clayFetchTimeoutMs: 30000
  # Cap on the single wait after a Clay 429, whether from Retry-After or the
  # one-second default used when Clay sends no header.
  clayRetryAfterMaxMs: 5000
  # Companies run at once in one batch. Each company mostly waits on vendors
  # (Clay, the Exa agent), so batching companies overlaps that wait time
  # instead of paying it once per company.
  companyConcurrency: 5
  # Safety bound on picks verified per company, applied in request order after
  # selection. Every rubric match up to this count is verified; the rubric and
  # the spend ceiling are the real limits.
  maxVerifyPerCompany: 25
  # Picks verified at once per company. Exa allows ten requests a second across the whole
  # run, and a batch of five companies starting every pick together bursts far past it.
  verifyConcurrency: 3

enrich:
  batchSize: 5
  emailTtlDays: 90
  linkedinTtlDays: 30
  # Effort Exa's agent spends per email run. Measured: "low" returns in about
  # 5 seconds for $0.025. Do not set "max": the vendor requires a beta request
  # header for it that this client does not send.
  exaAgentEffort: low
  # Seconds between polls of a running email agent run.
  exaAgentPollIntervalSeconds: 5
  # Polls allowed before a stuck email agent run is treated as failed. 24
  # polls at 5 seconds is 2 minutes, well past the measured 5-second
  # completion time. This is its own setting so raising the company poll
  # ceiling for constrained company discovery never silently changes how
  # long email enrichment waits for one person.
  exaAgentMaxPollAttempts: 24

# Spend ceilings. These stop work; they do not merely report it.
spend:
  # A single run stops starting new paid work once it has already spent this
  # much. Cost is only knowable after a call returns, so this stops the NEXT
  # round or batch, never the one in flight. Overshoot is bounded by one whole
  # interval: about $0.045 for a companies round, more for a people batch of
  # five. Measured runs: a companies run is $0.137, a people run over ten
  # companies is $0.100.
  perRunDollars: 2.00
  # An account refuses to start a new run once its day already costs this much.
  # Checked before any paid work, so a refused run spends nothing. Covers
  # company, people, and enrich runs alike.
  perAccountDailyDollars: 50.00

judge:
  cacheTtlSeconds: 86400

model:
  # Milliseconds before a structured model call is aborted. Kept apart from Exa's own fetch
  # timeout: a judge call reasoning over a batch of rows needs longer than a plain vendor
  # fetch, and sharing that shorter timeout aborted it mid-flight.
  timeoutMs: 90000

# Retry and timeout budgets for Cloudflare Workflow steps.
# Cloudflare's own default is 5 retries and a 10 minute timeout on every step.
stepConfig:
  # Steps that bill a vendor on every attempt. A retry re-runs the whole paid
  # call, so the limit stays low. The timeout must clear the slowest real run:
  # a companies round has been measured at about 100 seconds.
  paidCall:
    retries:
      limit: 2
      delay: 10 seconds
    timeout: 5 minutes
  # Steps that only touch the database, where a retry is free. A transient blip
  # is worth retrying and costs nothing, so this keeps Cloudflare's default.
  databaseCall:
    retries:
      limit: 5
      delay: 1 second
    timeout: 60 seconds
